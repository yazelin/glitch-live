<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>格莉奇・她的手機（畫面原型）</title>
<meta name="description" content="《格莉奇與黑洞先生・調查篇》背包裡那支手機，四頁完整原型。先在這裡驗畫面，確認之後才搬進 Larch。">
<!--
  這是原型，不是 Larch 卡片。驗完畫面才把介面搬進 glitch-vn 的 larch/cards/phone.html。
  內容照 glitch-vn/design/調查篇-手機.md 與 調查篇-直播.md，沒有自己加設定。
  影片右下角有 Gemini 浮水印，底部聊天室、輸入列與分頁列負責蓋住它；
  ?wm=1 會把浮水印框畫出來，主控台的「驗浮水印」按鈕跑命中測試。
-->
<style>
:root{
  --bg:#04080c; --win:#11161b; --sunk:#0a1319; --body:#15171d; --edge:#2a2d36;
  --panel:#0c1116; --card:#121920; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --cy:#25c2e8; --mint:#7cf3c0; --purple:#b78bff;
  --text:#dfe8ec; --muted:#93a3ac; --faint:#6d7d84; --red:#e0323f;
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:rgba(183,139,255,.4) transparent}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(183,139,255,.4);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(183,139,255,.65)}
/* 手機螢幕裡面那條要更不起眼，真的手機是一條半透明的白 */
#page{scrollbar-color:rgba(255,255,255,.2) transparent}
#page::-webkit-scrollbar{width:4px}
#page::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}
#page::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.34)}
html,body{margin:0;min-height:100%}
body{background:
    radial-gradient(1100px 700px at 50% -10%,rgba(183,139,255,.16),transparent 62%),
    radial-gradient(800px 500px at 12% 108%,rgba(37,194,232,.12),transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;justify-content:center;
  padding-block:36px;padding-left:16px;padding-right:16px}

/* ── 手機殼（沿用 glitch-vn/larch/cards/phone.html 的規格） ── */
#phone{position:relative;flex:none;width:min(390px,92vw);height:min(800px,88vh);min-height:620px;
  background:var(--body);border-radius:38px;padding:12px;
  box-shadow:0 30px 90px rgba(0,0,0,.7),0 0 0 2px var(--edge),0 0 60px rgba(183,139,255,.12)}
#screen{position:relative;width:100%;height:100%;border-radius:28px;overflow:hidden;background:#07080c;isolation:isolate}
#vid,#poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#poster{z-index:1}
#vid{z-index:0}

/* ══ 直播頁 ══ */
/* 頂端只留一列，不然會壓到她的臉（她在畫面裡的眼睛落在螢幕 8%～11%） */
.scrim-t{position:absolute;z-index:3;left:0;right:0;top:0;height:19%;
  background:linear-gradient(rgba(4,6,10,.85),rgba(4,6,10,.4) 52%,transparent);pointer-events:none}
/* 浮水印在螢幕 84%～96% 之間（見頁尾的 WM），所以這一塊到 60% 就要是實心，
   半透明的遮罩只會把浮水印壓暗、壓不掉。 */
.scrim-b{position:absolute;z-index:3;left:0;right:0;bottom:0;height:46%;pointer-events:none;
  background:linear-gradient(transparent,rgba(4,6,10,.42) 26%,rgba(4,6,10,.88) 50%,#04060a 60%,#04060a)}
.live-ui{transition:opacity .25s}
#screen.off .live-ui{opacity:0;pointer-events:none}

#hdr{position:absolute;z-index:6;left:0;right:0;top:0;padding:11px 11px 0;display:flex;align-items:center;gap:8px}
#hdr .av{flex:none;width:34px;height:34px;border-radius:50%;background:#2a2d36 center/cover no-repeat;
  box-shadow:0 0 0 2px var(--purple),0 0 12px rgba(183,139,255,.5)}
#hdr .who{flex:1;min-width:0}
#hdr .nm{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;letter-spacing:.02em;
  text-shadow:0 1px 5px rgba(0,0,0,.8)}
#hdr .nm i{font-style:normal;color:var(--cy);font-size:11px}
#hdr .sub{display:flex;align-items:center;gap:5px;margin-top:3px;font-size:10.5px;color:#b7c4cb;
  font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 1px 5px rgba(0,0,0,.85)}
#hdr .sub .sep{color:var(--faint)}
#follow{appearance:none;border:0;cursor:pointer;font:inherit;font-size:11.5px;font-weight:700;
  padding:6px 13px;border-radius:999px;background:var(--cy);color:#04080c;transition:background .15s}
#follow:hover{background:var(--mint)}
#follow.on{background:rgba(255,255,255,.12);color:var(--text)}

.pill{display:inline-flex;align-items:center;gap:4px;height:17px;padding:0 6px;border-radius:4px;
  font-size:9.5px;font-weight:700;letter-spacing:.08em;background:rgba(8,10,16,.66);
  backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1)}
.pill.live{background:var(--red);border-color:transparent;color:#fff}
.pill.live.wait{background:rgba(8,10,16,.66);border:1px solid rgba(255,255,255,.1);color:var(--muted)}
.pill.live.wait b{background:var(--muted)}
.pill.live b{width:5px;height:5px;border-radius:50%;background:#fff;animation:blink 1.6s steps(1,end) infinite}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.15}}
.eye{display:inline-block;width:12px;height:8px;box-shadow:inset 0 0 0 1.4px currentColor;
  border-top:1.4px solid currentColor;border-radius:50%;position:relative}
.eye::after{content:"";position:absolute;inset:3px 4.5px;border-radius:50%;background:currentColor}

#title{position:absolute;z-index:6;left:12px;right:58px;bottom:306px;font-size:12.5px;line-height:1.55;
  color:var(--text);text-shadow:0 1px 6px rgba(0,0,0,.9),0 0 18px rgba(0,0,0,.6)}
#title #when{display:block;font-size:10.5px;color:#b7c4cb;margin-bottom:3px;letter-spacing:.04em}

#rail{position:absolute;z-index:6;right:8px;bottom:250px;display:flex;flex-direction:column;gap:13px;align-items:center}
.act{appearance:none;border:0;cursor:pointer;font:inherit;color:var(--text);background:none;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:0;line-height:1}
.act .ic{width:40px;height:40px;border-radius:50%;background:rgba(10,13,19,.6);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:transform .12s,background .15s}
.act:hover .ic{background:rgba(37,194,232,.22);transform:translateY(-2px)}
.act small{font-size:10px;color:#cfd9df;font-variant-numeric:tabular-nums;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.act.liked .ic{background:rgba(224,50,63,.3);border-color:rgba(224,50,63,.6)}
.act.liked small{color:#ff8b93}

#chatwrap{position:absolute;z-index:5;left:0;right:0;bottom:104px;height:190px;
  -webkit-mask-image:linear-gradient(transparent,#000 44px);mask-image:linear-gradient(transparent,#000 44px)}
#chat{position:absolute;inset:0;overflow:hidden;padding:0 12px 4px;display:flex;flex-direction:column;justify-content:flex-end;gap:5px}
.row{display:flex;gap:6px;align-items:baseline;font-size:12.5px;line-height:1.45;
  animation:rise .26s ease-out;text-shadow:0 1px 4px rgba(0,0,0,.85);transition:opacity .6s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.row .id{flex:none;font-weight:700;font-size:11.5px}
.row .tx{color:#eef3f6;word-break:break-word}
.row.link .tx{color:var(--cy);text-decoration:underline;text-underline-offset:2px}
.row.read{background:rgba(124,243,192,.14);border-left:2px solid var(--mint);
  border-radius:0 6px 6px 0;padding:3px 7px;margin-left:-9px}
.row.mine{background:rgba(183,139,255,.18);border-left:2px solid var(--purple);
  border-radius:0 6px 6px 0;padding:3px 7px;margin-left:-9px}
.row.mine .id{color:var(--purple)}
.row.gone{opacity:0}
.row.sys .tx{color:var(--faint)}

#bar{position:absolute;z-index:6;left:0;right:0;bottom:52px;height:52px;display:flex;align-items:center;gap:8px;
  padding:0 12px 6px;background:#04060a}
#say{flex:1;height:36px;border-radius:999px;background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;padding:0 14px;
  font-size:12.5px;color:#9aa7b0;cursor:pointer}
#say.hot{border-color:var(--purple);color:#cbb6f5}
#heart{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.09);color:#ff7d87;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#hearts{position:absolute;z-index:5;right:6px;bottom:104px;width:46px;height:190px;pointer-events:none;overflow:hidden}
.hb{position:absolute;bottom:0;left:12px;font-size:15px;color:#ff7d87;animation:fly 2.1s ease-out forwards}
@keyframes fly{0%{opacity:0;transform:translate(0,0) scale(.6)}
  12%{opacity:1}100%{opacity:0;transform:translate(var(--dx,-14px),-170px) scale(1.15)}}

/* 假載入 */
#load{position:absolute;z-index:4;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:rgba(4,6,10,.4);backdrop-filter:blur(11px);transition:opacity .45s}
#load.gone{opacity:0;pointer-events:none}
#ring{width:46px;height:46px;border-radius:50%;border:2.5px solid rgba(255,255,255,.14);
  border-top-color:var(--cy);animation:spin .82s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#lmsg{font-size:12.5px;color:var(--muted);letter-spacing:.04em}
#lbar{width:158px;height:3px;border-radius:2px;background:rgba(255,255,255,.13);overflow:hidden}
#lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--mint))}
@media (prefers-reduced-motion:reduce){#ring,.pill.live b,.row{animation:none}}

/* ══ 其餘三頁 ══ */
#page{position:absolute;z-index:7;left:0;right:0;top:0;bottom:52px;background:var(--panel);
  overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
#screen.page-on #page{display:block}
#screen.tab-msg #page{display:flex;flex-direction:column}
#status{display:flex;justify-content:space-between;align-items:center;padding:13px 16px 8px;
  font-size:11px;color:var(--faint);letter-spacing:.05em;position:sticky;top:0;background:var(--panel);z-index:2}
#status b{color:var(--muted);font-weight:600}
#status .sb{display:block;color:var(--faint)}   /* 訊號、Wi-Fi、電池。原本那三個 ▮ 看不出是訊號還是電量 */
.ttl{margin:4px 16px 10px;font-size:17px;font-weight:700;letter-spacing:.02em}
.empty{margin:52px 22px;color:var(--faint);font-size:13px;line-height:2.1;text-align:center}

/* 訊息 */
.msg{display:flex;gap:10px;padding:9px 14px}
.msg .av{flex:none;width:34px;height:34px;border-radius:11px;background:#222a33 center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#8e9aa4}
.msg .bd{max-width:80%}
.msg .who{font-size:10.5px;color:var(--faint);margin:0 0 3px 2px}
.msg .bub{background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px;
  padding:8px 12px;font-size:13px;line-height:1.65;color:var(--text)}
.msg .when{font-size:10px;color:var(--faint);margin:4px 0 0 3px}
#reply{display:flex;gap:8px;padding:10px 12px 14px;margin-top:auto;border-top:1px solid var(--line)}
#reply span{flex:1;border:1px solid var(--line);border-radius:18px;padding:8px 13px;font-size:12.5px;
  color:#4e5a62;background:var(--sunk)}
#reply i{width:34px;border-radius:50%;background:#1a222a}

/* 格莉奇的頁面 */
.prof{display:flex;gap:12px;align-items:center;padding:6px 16px 12px}
.prof .av{flex:none;width:54px;height:54px;border-radius:50%;background:#222a33 center/cover no-repeat;
  box-shadow:0 0 0 2px var(--purple)}
.prof b{display:block;font-size:15px}
.prof small{display:block;color:var(--faint);font-size:11.5px;margin-top:3px}
.prof .cnt{margin-top:5px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.post{border-top:7px solid #070b0f;padding:12px 16px 8px}
.post .day{font-size:10.5px;color:var(--faint);margin-bottom:6px;letter-spacing:.04em}
.post .txt{font-size:13.5px;line-height:1.8;white-space:pre-line}
.cm{margin:9px 0 0;padding:8px 0 2px;border-top:1px solid var(--line)}
.cm .c{display:flex;gap:7px;font-size:12px;line-height:1.65;padding:3px 0;align-items:baseline}
.cm .id{flex:none;font-weight:700}
.cm .id.del{color:#5c6169;font-weight:400;text-decoration:line-through}
.cm .t{color:#c7d2d8} .cm .tm{margin-left:auto;color:var(--faint);font-size:10.5px;flex:none}
.old{border-top:7px solid #070b0f;padding:12px 16px 22px}
.old .day{font-size:10.5px;color:var(--faint);margin-bottom:6px}
.old .note{font-size:10.5px;color:#4e5a62;margin-top:8px}

/* 直播・沒開台 */
.offair{padding:14px 16px 20px}
.offair .box{aspect-ratio:9/13;border-radius:14px;background:var(--card) center/cover no-repeat;
  position:relative;overflow:hidden;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center}
.offair .box::after{content:"";position:absolute;inset:0;background:rgba(4,8,12,.72)}
.offair .box span{position:relative;z-index:1;font-size:12.5px;color:var(--muted);letter-spacing:.06em}
.offair p{font-size:13px;line-height:1.9;margin:14px 2px 0}
.offair p.dim{color:var(--faint)}

/* 分頁列 */
#tabs{position:absolute;z-index:9;left:0;right:0;bottom:0;height:52px;display:flex;
  background:#04060a;border-top:1px solid var(--line)}
#tabs button{flex:1;appearance:none;border:0;background:none;font:inherit;font-size:11.5px;
  color:#6d7d84;cursor:pointer;position:relative;padding:0 0 4px;transition:color .15s}
#tabs button.on{color:var(--cy);font-weight:700}
#tabs button .dot{position:absolute;top:11px;right:24%;width:6px;height:6px;border-radius:50%;background:var(--red)}

/* 留言（第五天） */
#compose{position:absolute;z-index:10;inset:0;background:rgba(4,6,10,.42);backdrop-filter:blur(2px);
  display:none;flex-direction:column;justify-content:flex-end}
#screen.compose-on #compose{display:flex}
#compose .sheet{background:var(--panel);border-top:1px solid var(--line2);padding:16px 14px 18px;
  border-radius:18px 18px 0 0}
#compose .field{min-height:44px;border:1px solid var(--line2);border-radius:12px;background:var(--sunk);
  padding:11px 13px;font-size:13.5px;line-height:1.6;color:var(--text)}
#compose .field i{display:inline-block;width:1.5px;height:15px;background:var(--cy);
  vertical-align:-2px;margin-left:1px;animation:caret 1s steps(1,end) infinite}
@keyframes caret{0%,50%{opacity:1}51%,100%{opacity:0}}
#compose .btns{display:flex;gap:8px;margin-top:12px}
#compose button{flex:1;appearance:none;border:1px solid var(--line2);background:var(--sunk);color:var(--text);
  font:inherit;font-size:13px;padding:11px 0;border-radius:12px;cursor:pointer}
#compose button.go{background:var(--cy);border-color:var(--cy);color:#04080c;font-weight:700}
#compose button[disabled]{opacity:.4;cursor:default}

/* ── 主控台（原型用，不進遊戲） ── */
#panel{flex:none;width:min(328px,92vw);background:var(--win);border:1px solid var(--line);
  border-radius:14px;padding:18px 18px 16px}
#panel h1{margin:0 0 4px;font-size:15px;letter-spacing:.02em}
#panel p{margin:0 0 14px;font-size:12px;line-height:1.75;color:var(--muted)}
#panel h2{margin:16px 0 7px;font-size:11px;letter-spacing:.12em;color:var(--faint);font-weight:700}
.grp{display:flex;gap:6px;flex-wrap:wrap}
.grp button{appearance:none;cursor:pointer;font:inherit;font-size:12px;padding:7px 11px;border-radius:8px;
  background:var(--sunk);border:1px solid var(--line2);color:var(--text);transition:.15s}
.grp button:hover{border-color:var(--cy);color:var(--cy)}
.grp button.on{background:var(--cy);border-color:var(--cy);color:#04080c;font-weight:700}
#out{margin-top:12px;font-size:11.5px;line-height:1.8;color:var(--faint);white-space:pre-wrap;
  background:var(--sunk);border-radius:8px;padding:10px 12px;min-height:38px}
#out .ok{color:var(--mint)} #out .no{color:#ff8b93}
#wmbox{position:absolute;z-index:20;outline:2px solid #ff2f6d;background:rgba(255,47,109,.2);pointer-events:none;display:none}
</style>

<div id="phone"><div id="screen">
  <video id="vid" playsinline muted loop preload="auto" poster="assets/poster.webp"></video>
  <img id="poster" src="assets/poster.webp" alt="格莉奇在直播間裡向鏡頭揮手">
  <div class="scrim-t live-ui"></div><div class="scrim-b live-ui"></div>

  <div id="hdr" class="live-ui">
    <div class="av" id="av"></div>
    <div class="who">
      <div class="nm">格莉奇 <i>✦</i></div>
      <div class="sub">
        <span class="pill live" id="livepill"><b></b>LIVE</span>
        <span class="eye"></span><span id="viewers">0</span>
        <span class="sep">・</span><span id="elapsed">00:00</span>
      </div>
    </div>
    <button id="follow" type="button">追蹤</button>
  </div>

  <div id="title" class="live-ui"><span id="when"></span><span id="ttl"></span></div>

  <div id="rail" class="live-ui">
    <button class="act" id="like" type="button"><span class="ic">♡</span><small id="likes">0</small></button>
    <button class="act" id="gift" type="button"><span class="ic">◈</span><small>抖內</small></button>
    <button class="act" id="sound" type="button"><span class="ic">◁</span><small>靜音</small></button>
    <button class="act" id="share" type="button"><span class="ic">↗</span><small>分享</small></button>
  </div>

  <div id="chatwrap" class="live-ui"><div id="chat"></div></div>
  <div id="hearts" class="live-ui"></div>
  <div id="bar" class="live-ui"><div id="say">說點什麼⋯⋯</div><div id="heart">♥</div></div>

  <div id="load" class="live-ui">
    <div id="ring"></div>
    <div id="lmsg">連線中⋯⋯</div>
    <div id="lbar"><i></i></div>
  </div>

  <div id="page"></div>

  <nav id="tabs">
    <button type="button" data-p="msg">訊息<span class="dot" id="dot-msg" hidden></span></button>
    <button type="button" data-p="feed">格莉奇<span class="dot" id="dot-feed" hidden></span></button>
    <button type="button" data-p="live">直播</button>
    <button type="button" data-p="call">電話</button>
  </nav>

  <div id="compose"><div class="sheet">
    <div class="field" id="cfield"></div>
    <div class="btns">
      <button type="button" id="ccancel">不打</button>
      <button type="button" id="csend" class="go" disabled>送出去</button>
    </div>
  </div></div>

  <div id="wmbox"></div>
</div></div>

<div id="panel">
  <h1>她的手機・畫面原型</h1>
  <p>《調查篇》背包裡那支手機，四頁。內容照 <code>design/調查篇-手機.md</code> 與
     <code>調查篇-直播.md</code>。這裡只驗畫面，確認之後才搬進 Larch。</p>
  <h2>第幾天（板到第十三天）</h2>
  <div class="grp" id="days"></div>
  <h2>什麼時候</h2>
  <div class="grp" id="slots"></div>
  <h2>旗標（訊息靠它，不靠天數）</h2>
  <div class="grp" id="flags"></div>
  <h2>驗收</h2>
  <div class="grp">
    <button type="button" id="replay">重播載入</button>
    <button type="button" id="check">驗浮水印</button>
    <button type="button" id="showwm">顯示浮水印框</button>
  </div>

function wmRect(){
  var r=vid.getBoundingClientRect(), vw=vid.videoWidth||720, vh=vid.videoHeight||1280;
  var k=Math.max(r.width/vw, r.height/vh), dw=vw*k, dh=vh*k;
  var ox=r.left+(r.width-dw)/2, oy=r.top+(r.height-dh)/2;
  return {left:ox+WM.x0*dw, top:oy+WM.y0*dh, right:ox+WM.x1*dw, bottom:oy+WM.y1*dh, screen:screen.getBoundingClientRect()};
}
function checkCover(){
  var w=wmRect(), bad=0, pts=0;
  for(var a=0;a<=4;a++) for(var b=0;b<=4;b++){
    var x=w.left+(w.right-w.left)*a/4, y=w.top+(w.bottom-w.top)*b/4;
    if(x<w.screen.left||x>w.screen.right||y<w.screen.top||y>w.screen.bottom) continue; // 被裁掉的點等於看不到
    pts++;
    var e=document.elementFromPoint(x,y);
    if(!e || e===vid || e===poster || e.id==='screen') bad++;
  }
  return {ok:bad===0, points:pts, bad:bad};
}
function drawWm(on){
  var box=$('#wmbox'), w=wmRect(), s=w.screen;

}

$('#replay').addEventListener('click',function(){ show('live'); });
$('#check').addEventListener('click',function(){
  if(!onAir() || tab!=='live'){ out.innerHTML='<span class="no">現在不在直播畫面。</span>先切到第二、五或八天的晚上，分頁選直播，再驗一次。'; return; }
  var r=checkCover();
  out.innerHTML = r.ok
    ? '<span class="ok">蓋住了。</span>浮水印範圍取樣 '+r.points+' 點，全部命中底部介面，一點都沒有露出影片。'
    : '<span class="no">沒蓋住。</span>'+r.points+' 點裡有 '+r.bad+' 點直接打到影片，那幾點會看見浮水印。';
});
$('#showwm').addEventListener('click',function(){
  var on=$('#wmbox').style.display!=='block'; drawWm(on);
  out.textContent = on ? '紅框就是浮水印所在，正常情況下它應該整個埋在聊天室、輸入列與分頁列底下。' : '';
});
$('#like').addEventListener('click',function(){
  var on=this.className.indexOf('liked')<0;
  this.className='act'+(on?' liked':'');
  likes+=on?1:-1; $('#likes').textContent=fmt(likes); if(on) fly();
});
$('#heart').addEventListener('click',function(){ likes++; $('#likes').textContent=fmt(likes); fly(); fly(); });
$('#follow').addEventListener('click',function(){
  var on=this.className!=='on'; this.className=on?'on':''; this.textContent=on?'追蹤中':'追蹤';
});
$('#sound').addEventListener('click',function(){
  vid.muted=!vid.muted;
  this.querySelector('.ic').textContent = vid.muted?'◁':'◀';
  this.querySelector('small').textContent = vid.muted?'靜音':'有聲';
});
$('#gift').addEventListener('click',function(){ post('你','送出了一個罐頭','sys'); for(var i=0;i<5;i++) later(fly,i*90); });
$('#share').addEventListener('click',function(){ post('你','把連結複製走了','sys'); });
$('#say').addEventListener('click',openCompose);
$('#ccancel').addEventListener('click',function(){ screen.classList.remove('compose-on'); });
$('#csend').addEventListener('click',sendComment);
window.addEventListener('resize',function(){ if($('#wmbox').style.display==='block') drawWm(true); });
if(location.search.indexOf('wm=1')>=0) setTimeout(function(){ drawWm(true); },2600);

setTime(8,2);
window.checkCover=checkCover; window.wmRect=wmRect; window.setTime=setTime; window.show=show;  // Playwright / console 用
</script>
</html>
